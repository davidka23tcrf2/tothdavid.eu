<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />

<title data-i18n="docTitle">Admin</title>
<meta name="theme-color" content="#0a0806" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="/szamok/szamok.css" />
</head>

<body>

<main class="admin">
  <div class="topbar">
    <span></span>
    <div class="topbar-right bar-group">
      <button class="btn btn-quiet btn-small" type="button" id="logout" hidden data-i18n="logout">Kilépés</button>
      <div class="lang" role="group" aria-label="Nyelv / Language">
        <button type="button" data-lang="hu" aria-pressed="true">HU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>

  <h1 class="title" data-i18n="title">Beküldött számok</h1>

  <!-- ============ login ============ -->
  <form class="login" id="login" novalidate>
    <label class="field">
      <span data-i18n="password">Jelszó</span>
      <input type="password" id="password" autocomplete="current-password" />
    </label>
    <div><button class="btn" type="submit" data-i18n="signIn">Belépés</button></div>
    <p class="msg is-error" id="login-msg" role="status" aria-live="polite"></p>
  </form>

  <!-- ============ not set up ============ -->
  <section class="setup" id="setup" hidden>
    <h2 data-i18n="setupH">Még nincs beállítva</h2>
    <div data-i18n-html="setupBody"></div>
  </section>

  <!-- ============ dashboard ============ -->
  <section id="dash" hidden>
    <div class="bar">
      <span class="status" id="status"></span>
      <button class="btn btn-quiet btn-small" type="button" id="toggle-open"></button>
    </div>

    <p class="share">
      <span data-i18n="shareLabel">A résztvevőknek ezt a címet add meg:</span>
      <code id="share-url"></code>
      <button class="btn btn-quiet btn-small" type="button" id="copy-link" data-i18n="copyLink">Link másolása</button>
    </p>

    <div class="overview">
      <div>
        <dl class="figures">
          <div class="figure"><dt data-i18n="figSubs">Beküldés</dt><dd id="f-subs">0</dd></div>
          <div class="figure"><dt data-i18n="figNums">Szám</dt><dd id="f-nums">0</dd></div>
          <div class="figure"><dt data-i18n="figFlagged">Jelölt</dt><dd id="f-flagged">0</dd></div>
        </dl>
        <div class="tools">
          <button class="btn btn-small" type="button" id="open-benford" data-i18n="openBenford">Megnyitás a Benford-ellenőrzőben</button>
          <button class="btn btn-quiet btn-small" type="button" id="copy-nums" data-i18n="copyNums">Számok másolása</button>
          <button class="btn btn-quiet btn-small" type="button" id="dl-csv" data-i18n="dlCsv">CSV letöltése</button>
        </div>
        <label class="check">
          <input type="checkbox" id="skip-flagged" />
          <span data-i18n="skipFlagged">Jelölt beküldések kihagyása az exportból</span>
        </label>
        <label class="check">
          <input type="checkbox" id="auto" checked />
          <span data-i18n="auto">Frissítés 10 másodpercenként</span>
        </label>
        <p class="tools-note" id="tools-note" role="status" aria-live="polite"></p>
      </div>

      <div class="mini">
        <p class="mini-h" data-i18n="miniH">Első számjegyek eddig, a Benford-törvény görbéjével</p>
        <div id="mini-chart"></div>
        <p class="mini-note" id="mini-note"></p>
      </div>
    </div>

    <h2 class="subs-h" data-i18n="subsH">Beküldések</h2>
    <div class="table-wrap">
      <table class="subs">
        <thead>
          <tr><th data-i18n="thWhen">Idő</th><th data-i18n="thName">Név</th><th data-i18n="thNums">Számok</th><th data-i18n="thFlags">Jelölés</th><th></th></tr>
        </thead>
        <tbody id="subs"></tbody>
      </table>
    </div>
    <p class="empty-note" id="subs-empty" hidden data-i18n="subsEmpty">Még nincs beküldés.</p>
  </section>
</main>

<script src="/lang.js"></script>
<script src="/szamok/admin/admin.js"></script>
</body>
</html>
